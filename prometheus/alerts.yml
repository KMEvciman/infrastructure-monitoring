groups:
  - name: infrastructure-alerts
    rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 30s

        labels:
          severity: critical

        annotations:
          summary: "Node Exporter is down"
          description: "Prometheus cannot scrape metrics from Node Exporter."

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[1m])) * 100) > 80
        for: 30s

        labels:
          severity: warning

        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage on {{ $labels.instance }} has been above 80% for 30 seconds."
